[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lanegame"
version = "4.0.0"
description = "League of Legends laning as a two-player zero-sum stochastic game: an exact solver for the wave-management game, a champion and economy simulator, shared-policy PPO self-play and Bayesian opponent modelling"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.13", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
rl = ["pettingzoo>=1.24", "gymnasium>=0.29", "torch>=2.2"]   # PettingZoo adapter, PPO (lanegame.rl), the experiments
demo = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]     # the web demo's API (lanegame.demo.api); httpx for its tests

[tool.setuptools.packages.find]
include = ["lanegame*", "experiments*"]   # every package with an __init__.py; a new study package needs no entry here
namespaces = false

[tool.setuptools.package-data]
"lanegame.demo" = ["manifest.json", "guides/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
