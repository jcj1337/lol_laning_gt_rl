[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lanegame"
version = "3.0.0"
description = "Finite-horizon zero-sum stochastic game of League of Legends wave management (farming economy, Contest/Safe positioning, siege objectives: tower pressure vs. vision), with an exact equilibrium solver"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.13", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
rl = ["pettingzoo>=1.24", "gymnasium>=0.29", "torch>=2.2"]   # optional: PettingZoo adapter, PPO (lanegame.rl)

[tool.setuptools]
packages = ["lanegame", "lanegame.env", "lanegame.experiments", "lanegame.experiments.v1", "lanegame.experiments.siege", "lanegame.experiments.champions", "lanegame.experiments.rl", "lanegame.rl", "lanegame.diagnostics"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
lanegame = ["data/*.json"]
