[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lanegame"
version = "3.0.0"
description = "Finite-horizon zero-sum stochastic game of League of Legends wave management (farming economy, Contest/Safe positioning, siege objectives: tower pressure vs. vision), with an exact equilibrium solver"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.13", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
rl = ["pettingzoo>=1.24", "gymnasium>=0.29", "torch>=2.2"]   # optional: PettingZoo adapter, PPO (lanegame.rl)
viewer = ["streamlit>=1.40", "plotly>=5.20"]                 # optional: the M4.2e-D debugger (lanegame.viewer)
demo = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]     # optional: the M6 demo API (lanegame.demo.api); httpx for its tests

[tool.setuptools.packages.find]
include = ["lanegame*"]      # every subpackage with an __init__.py, so new milestone packages need no entry here
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
lanegame = ["data/*.json"]
"lanegame.demo" = ["manifest.json", "guides/*.json"]
