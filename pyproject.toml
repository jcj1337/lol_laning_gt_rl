[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lanegame"
version = "1.0.0"
description = "Finite-horizon zero-sum stochastic game of League of Legends wave management, with an exact equilibrium solver"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.13", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["lanegame", "lanegame.experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
