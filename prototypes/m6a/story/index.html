<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lane Study · prototype C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#composer">Skip to the action panel</a>

<header class="top">
  <button class="icon-btn turns-toggle" id="turnsToggle" aria-controls="history" aria-expanded="false">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg><span>Turns</span>
  </button>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">Lane Study</span>
    <span class="brand-tag">prototype C · story</span>
  </div>
  <label class="picker">
    <span class="sr-only">Game</span>
    <select id="gamePicker"></select>
  </label>
  <div class="seg mode-switch" role="group" aria-label="Mode">
    <button id="modePlay" aria-pressed="false">Play</button>
    <button id="modeWatch" aria-pressed="false">Watch</button>
  </div>
  <div class="prov" id="prov"></div>
  <button class="link-btn" id="aboutBtn">About this game</button>
</header>

<div class="app">
  <aside class="history" id="history" aria-label="Turn history">
    <div class="history-head">
      <h2>Turns</h2>
      <div class="history-cols" id="historyCols"></div>
    </div>
    <ol class="history-list" id="historyList"></ol>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main">
    <section class="stage" id="stage" aria-label="The lane">
      <div class="hud-wrap">
        <div class="hud hud-a" id="hudA"></div>
        <div class="hud hud-b" id="hudB"></div>
      </div>
      <svg id="lane" role="img" aria-labelledby="laneText" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="stage-tag" id="stageTag" hidden>Earlier turn</div>
      <p id="laneText" class="sr-only" aria-live="polite"></p>
    </section>

    <section class="timebar" aria-label="Timeline">
      <div class="nav">
        <div class="nav-where" id="navWhere"></div>
        <div class="nav-buttons">
          <button class="nav-btn" id="btnFirst" aria-label="First position (Home)" title="First (Home)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 4v12M15 4l-7 6 7 6z"/></svg></button>
          <button class="nav-btn" id="btnPrev" aria-label="Previous turn (Left arrow)" title="Previous (←)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13 4l-7 6 7 6z"/></svg></button>
          <button class="nav-btn play" id="btnPlay" aria-label="Play" title="Play or pause (Space)"><svg viewBox="0 0 20 20" aria-hidden="true"><path class="i-play" d="M6 4l10 6-10 6z"/><path class="i-pause" d="M6 4h3v12H6zM11 4h3v12h-3z"/></svg></button>
          <button class="nav-btn" id="btnNext" aria-label="Next turn (Right arrow)" title="Next (→)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4l7 6-7 6z"/></svg></button>
          <button class="nav-btn" id="btnLast" aria-label="Latest position (End)" title="Latest (End)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15 4v12M5 4l7 6-7 6z"/></svg></button>
        </div>
        <div class="seg speed" role="group" aria-label="Playback speed" id="speed"></div>
      </div>
      <div class="timeline" id="timeline" role="slider" tabindex="0" aria-label="Timeline: choose a position"
           aria-valuemin="0"></div>
    </section>

    <section class="lower" id="lower">
      <div class="banner" id="banner" hidden role="status">
        <span class="banner-text" id="bannerText"></span>
        <button class="btn btn-banner" id="btnReturn">Return to current turn</button>
      </div>
      <article class="card" id="card" aria-live="polite"></article>
      <section class="composer" id="composer" tabindex="-1" aria-label="Action panel"></section>
      <section class="sheet" id="sheet" hidden aria-label="Details">
        <div class="sheet-head">
          <div class="tabs" role="tablist" id="sheetTabs"></div>
          <button class="icon-btn sheet-close" id="sheetClose" aria-label="Close details"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
        </div>
        <div class="sheet-body" id="sheetBody" role="tabpanel"></div>
      </section>
    </section>
  </main>
</div>

<dialog id="about" aria-labelledby="aboutTitle">
  <div class="about-inner" id="aboutBody"></div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
