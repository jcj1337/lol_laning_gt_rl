<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laning simulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg id="lane" class="scene" role="img" aria-labelledby="laneText"></svg>
<p id="laneText" class="sr-only" aria-live="polite"></p>

<div class="hud">
  <section class="panel st" id="stA" aria-label="Seat A"></section>
  <section class="panel st right" id="stB" aria-label="Seat B"></section>

  <header class="panel topbar" id="topbar">
    <div class="seg" role="group" aria-label="Mode">
      <button id="modePlay" aria-pressed="false">Play</button>
      <button id="modeWatch" aria-pressed="false">Watch</button>
    </div>
    <div class="context" id="context"></div>
    <button class="linkbtn" id="aboutBtn">About</button>
    <button class="btn" id="detailsBtn" aria-expanded="false" aria-controls="details">Details</button>
  </header>

  <div class="panel pill" id="turnPill"><span id="turnLabel"></span><span class="rectype" id="recType"></span></div>
  <div class="panel pill banner" id="banner" hidden role="status">
    <span id="bannerText"></span>
    <button class="btn primary" id="btnReturn">Return to current turn</button>
  </div>

  <aside class="panel history" id="history" aria-label="Turn history">
    <div class="h-top">
      <span class="h-title">Turns</span>
      <button class="iconbtn" id="hToggle" aria-expanded="true" title="Hide the turn history" aria-label="Hide the turn history">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
    </div>
    <div class="h-head"><span>#</span><span id="hA"></span><span id="hB"></span></div>
    <ol class="h-list" id="hList"></ol>
    <div class="nav" role="group" aria-label="Move through the turns">
      <button id="btnFirst" title="First (Home)" aria-label="First position"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3v10M12 3 6 8l6 5z"/></svg></button>
      <button id="btnPrev" title="Previous (Left arrow)" aria-label="Previous turn"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 3 5 8l6 5z"/></svg></button>
      <button id="btnNext" title="Next (Right arrow)" aria-label="Next turn"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m5 3 6 5-6 5z"/></svg></button>
      <button id="btnLast" title="Latest (End)" aria-label="Latest position"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M12 3v10M4 3l6 5-6 5z"/></svg></button>
    </div>
  </aside>

  <section class="panel strip" id="strip" aria-label="Actions">
    <div class="summary" id="summary" aria-live="polite"></div>
    <div class="controls" id="controls"></div>
  </section>

  <section class="panel graph" id="graphPanel" aria-labelledby="gTitle">
    <div class="g-head">
      <h2 id="gTitle">Gold lead</h2>
      <span class="g-note" id="gNote"></span>
      <label class="g-toggle"><input type="checkbox" id="gEvents"> Show events</label>
      <button class="linkbtn" id="gExpand" aria-expanded="false">Expand</button>
    </div>
    <div id="graph" class="g-plot"></div>
  </section>
</div>

<aside class="details" id="details" hidden aria-label="Details">
  <div class="d-head"><h2 id="dTitle">Details</h2><button class="btn" id="dClose">Close</button></div>
  <div class="d-body" id="dBody"></div>
</aside>

<dialog id="about" aria-labelledby="aboutTitle"><div id="aboutBody"></div></dialog>
<dialog id="newGame" aria-labelledby="ngTitle">
  <form method="dialog" id="ngForm">
    <h2 id="ngTitle">New game</h2>
    <fieldset><legend>Play against</legend>
      <label><input type="radio" name="opp" value="sp:0" checked> Self-play agent <span class="muted">learned only by playing against itself</span></label>
      <label><input type="radio" name="opp" value="om:0"> Adaptive agent <span class="muted">guesses your style and adjusts to it</span></label>
    </fieldset>
    <fieldset><legend>The adaptive agent's guess about your style</legend>
      <label><input type="radio" name="belief" value="hidden" checked> Hidden until the game ends</label>
      <label><input type="radio" name="belief" value="shown"> Shown during the game</label>
    </fieldset>
    <div class="row-end"><button class="btn" value="cancel">Cancel</button><button class="btn primary" value="ok">Start</button></div>
  </form>
</dialog>
<dialog id="newSim" aria-labelledby="nsTitle">
  <form method="dialog" id="nsForm">
    <h2 id="nsTitle">New game between two agents</h2>
    <p class="muted">The engine plays 150 turns, then you watch them.</p>
    <label class="sel">Left (A) <select name="a"><option value="om:0">Adaptive agent</option><option value="sp:0">Self-play agent</option></select></label>
    <label class="sel">Right (B) <select name="b"><option value="sp:0">Self-play agent</option><option value="om:0">Adaptive agent</option></select></label>
    <div class="row-end"><button class="btn" value="cancel">Cancel</button><button class="btn primary" value="ok">Simulate</button></div>
  </form>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
