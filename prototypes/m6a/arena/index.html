<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lane Arena · M6a prototype A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<script>
  window.__errors = [];
  window.addEventListener('error', (e) => window.__errors.push(String(e.message || e)));
  window.addEventListener('unhandledrejection', (e) => window.__errors.push(String(e.reason && e.reason.stack || e.reason)));
</script>
</head>
<body>
<a class="skip" href="#command">Skip to the action controls</a>
<div class="app" id="app">
  <header class="topbar" role="banner">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 22 L16 6 L28 22 L22 22 L16 14 L10 22 Z" fill="currentColor"/><rect x="6" y="24" width="20" height="3" rx="1.5" fill="currentColor" opacity=".55"/></svg>
      <div><span class="brand-name">Lane Arena</span><span class="brand-sub">M6a prototype A · game-like lane</span></div>
    </div>
    <div class="top-controls">
      <label class="field"><span class="visually-hidden">Game</span>
        <select id="game-pick" aria-label="Recorded game"></select></label>
      <div class="seg" role="radiogroup" aria-label="Mode" id="mode-seg">
        <button role="radio" data-mode="play">Play</button>
        <button role="radio" data-mode="watch">Watch</button>
      </div>
      <button class="chip prov" id="prov-chip" aria-expanded="false" aria-controls="prov-pop"></button>
    </div>
    <div class="top-stats">
      <div class="stat"><span class="stat-k">Turn</span><span class="stat-v" id="turn-stat">—</span></div>
      <div class="stat lead" title="Earned gold of A minus earned gold of B, in resources. A lead, not a score: XP, HP and the wave are separate."><span class="stat-k">Earned-gold lead <abbr title="seat A minus seat B">A − B</abbr></span><span class="stat-v" id="lead-stat">—</span></div>
      <button class="btn ghost" id="detail-btn" aria-expanded="false" aria-controls="drawer" title="Details (D)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Details</button>
    </div>
    <div class="popover" id="prov-pop" hidden></div>
  </header>

  <main class="stage" id="stage">
    <section class="lane-wrap" aria-label="The lane">
      <div class="lane-frame">
        <svg id="lane" class="lane" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="lane-title">
          <title id="lane-title">The lane: bases, towers, minion waves and both champions</title>
        </svg>
        <div class="hud hud-a" id="hud-A" aria-hidden="true"></div>
        <div class="hud hud-b" id="hud-B" aria-hidden="true"></div>
        <div class="outcome-ribbon" id="ribbon" aria-hidden="true"></div>
        <div class="frame-tag" id="frame-tag" aria-hidden="true"></div>
        <div class="history-banner" id="hist-banner" hidden>
          <span class="hb-icon" aria-hidden="true">⟲</span>
          <span id="hist-text"></span>
          <button class="btn gold sm" id="return-btn">Return to current turn</button>
        </div>
        <div class="summary-card" id="summary" hidden role="dialog" aria-labelledby="summary-title"></div>
      </div>
      <p class="visually-hidden" aria-live="polite" id="sr-summary"></p>
    </section>

    <section class="command" id="command" aria-label="Actions and playback"></section>

    <aside class="history" aria-label="Turn history">
      <div class="hist-head">
        <h2>Turns</h2>
        <div class="nav" role="group" aria-label="Navigate turns">
          <button class="icon" id="nav-first" aria-label="First position (Home)"><svg viewBox="0 0 20 20"><path d="M5 4v12M15 4l-7 6 7 6z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
          <button class="icon" id="nav-prev" aria-label="Previous turn (Left arrow)"><svg viewBox="0 0 20 20"><path d="M13 4l-7 6 7 6z" fill="currentColor"/></svg></button>
          <button class="icon" id="nav-next" aria-label="Next turn (Right arrow)"><svg viewBox="0 0 20 20"><path d="M7 4l7 6-7 6z" fill="currentColor"/></svg></button>
          <button class="icon" id="nav-last" aria-label="Latest position (End)"><svg viewBox="0 0 20 20"><path d="M15 4v12M5 4l7 6-7 6z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
        </div>
      </div>
      <div class="play-row">
        <button class="btn play" id="play-btn" aria-label="Autoplay (Space)"></button>
        <div class="speeds" role="radiogroup" aria-label="Playback speed" id="speeds"></div>
      </div>
      <div class="hist-cols" aria-hidden="true"><span>#</span><span id="col-a">A</span><span id="col-b">B</span><span></span></div>
      <ol class="hist-list" id="hist-list" aria-label="One row per turn: both actions"></ol>
    </aside>
  </main>

  <aside class="drawer" id="drawer" aria-label="Details" hidden>
    <div class="drawer-head">
      <div class="tabs" role="tablist" id="tabs"></div>
      <button class="icon" id="drawer-close" aria-label="Close details (Escape)"><svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="drawer-body" id="drawer-body" role="tabpanel"></div>
  </aside>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
